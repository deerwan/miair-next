name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'img/**'
  # PR 触发: 跑测试和不发布的镜像构建; 发布任务由 if 守卫跳过
  # 不加 paths-ignore, 确保任何 PR 都产出 test check 供合并门禁判定
  pull_request:
  workflow_dispatch:

env:
  # Docker Hub 镜像 (无 registry 前缀即默认 docker.io)
  IMAGE_NAME: mrdeer1997/miair-next

# 同一分支/tag 连续推送时取消进行中的旧构建, 避免多架构构建排队

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 测试关卡: 后端 pytest + 前端构建校验, 失败则不发镜像
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend lint (ruff)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff check app/engine/airplay/shairport_server.py app/engine/airplay/timed_audio.py

      - name: Backend tests (pytest)
        working-directory: backend
        run: python -m pytest tests/ -v

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck & build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  build:
    needs: [test, image-check]
    # main/tag publish the same complete image; PR builds never publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: mrdeer1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main updates the tag used by the existing install/update flow.
            type=edge,branch=main
            # 短 SHA (便于回滚定位)
            type=sha,prefix=,format=short
            # 语义化版本标签 (仅打 tag 时): v1.2.3 -> 1.2.3 / 1.2 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: default
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=standard-amd64
            type=gha,scope=standard-arm64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # 同步 README 到 Docker Hub 镜像页 (仅 main 分支推送时)
      # 需要 Read/Write/Delete 权限的 Access Token; 同步失败不阻塞流水线
      - name: Sync README to Docker Hub
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: mrdeer1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}

  # Verify both architectures before merging and before publishing main/tags.
  image-check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: default
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: miair-next:pr-check
          cache-from: type=gha,scope=standard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=standard-${{ matrix.arch }}

      - name: Verify standard installation and AirPlay 2 lifecycle
        run: |
          docker run --rm -i --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            -e PYTHONPATH=/app/backend \
            miair-next:pr-check python - < backend/tests/fixtures/airplay2_container_smoke.py

  # 打 tag 时: 镜像构建成功后自动创建 GitHub Release
  # (「检查更新」端点读取 Releases API, 必须有 Release 才能被检测到)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Docker 镜像已发布到 Docker Hub (版本标签为去掉 v 前缀的语义化版本号, 如 v0.9.1 -> 0.9.1):

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:latest
            ```
