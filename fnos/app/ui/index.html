<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiAir Next</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 40px 48px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 380px;
        }
        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🎵</div>
        <h1>MiAir Next</h1>
        <p>DLNA 渲染器 · AirPlay 接收器<br>Web 管理后台</p>
        <a class="btn" href="javascript:void(0)" onclick="openApp()">打开管理后台</a>
    </div>
    <script>
        function openApp() {
            window.open('http://' + location.hostname + ':8300', '_blank');
        }
    </script>
</body>
</html>
